# BC Inventory — Web tier   ·   staging host 172.28.92.56
# Published on 8088: the 30xx range, 5432 and 8010 are already taken on this host.
name: bc-inventory-web

services:
  web:
    build:
      context: ../../frontend
    image: bc-inventory-web:staging
    container_name: bc-inventory-web
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      # Port 80 on this host belongs to its own nginx, which fronts
      # test-it-inventory.kpndomain.com and proxies here (host-nginx-vhost.conf).
      # Set WEB_BIND=127.0.0.1 to accept traffic only from that proxy.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:80"
    volumes:
      # nginx config is mounted, not baked in — edit + restart to repoint the API
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1, not localhost: newer nginx:alpine images resolve localhost to ::1 first, but
      # nginx listens on IPv4 only (listen 80), so "localhost" was refused and the container
      # showed unhealthy while serving normally. (No [::]:80 listener: it breaks nginx start on
      # hosts with IPv6 disabled.)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
