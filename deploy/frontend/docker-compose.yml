# BC Inventory — Web tier   ·   staging host 172.28.92.56
# Published on 8088: the 30xx range, 5432 and 8010 are already taken on this host.
name: bc-inventory-web

services:
  web:
    build:
      context: ../../frontend
    image: bc-inventory-web:staging
    container_name: bc-inventory-web
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      # The only port users need. Defaults to 8088; set WEB_PORT=80 in .env so
      # http://test-it-inventory.kpndomain.com works without a port suffix — check the host
      # port is free first (`ss -lntp | grep ':80 '`), or the container will fail to start.
      - "0.0.0.0:${WEB_PORT:-8088}:80"
    volumes:
      # nginx config is mounted, not baked in — edit + restart to repoint the API
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
