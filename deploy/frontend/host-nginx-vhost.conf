# BC Inventory — vhost for the nginx ALREADY RUNNING ON THE HOST of 172.28.92.56.
#
# That nginx owns port 80 and fronts the other applications on this server by hostname, so
# BC Inventory is added as one more virtual host rather than taking the port. It forwards to
# the bc-inventory-web container published on 127.0.0.1:8088 / 0.0.0.0:8088.
#
# Install:
#   cp host-nginx-vhost.conf /etc/nginx/conf.d/test-it-inventory.conf
#   nginx -t && systemctl reload nginx
#
# Staging is deliberately HTTP-only; no TLS block here by decision.

server {
    listen 80;
    listen [::]:80;
    server_name test-it-inventory.kpndomain.com;

    # AR-05 — security response headers. The session token lives in sessionStorage, so a script
    # injection would read it directly; the CSP is the second line that stops one executing.
    # "always" so they are present on error responses too, not just 200s.
    add_header X-Frame-Options "DENY" always;                    # no framing, so no clickjacking
    add_header X-Content-Type-Options "nosniff" always;          # no MIME guessing
    add_header Referrer-Policy "no-referrer" always;             # report URLs never leak outward
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Everything the app loads is served from this origin; nothing is fetched cross-origin.
    # style-src allows inline because React sets element style attributes directly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Enable once TLS terminates in front of this server (AR-02):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;                                           # don't advertise the version

    # MUST be at least as large as the container's 110m, and larger than the API's 100 MB cap.
    # nginx defaults to 1m, which would reject a real 31 MB BC 4.0 extract at this hop with a
    # bare 413 — before the request ever reaches the app that has a readable error for it.
    client_max_body_size 110m;

    # Parsing a 31 MB BC 4.0 upload takes seconds; do not let this hop time out first.
    proxy_connect_timeout 15s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;

    access_log /var/log/nginx/bc-inventory.access.log;
    error_log  /var/log/nginx/bc-inventory.error.log;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # $host carries test-it-inventory.kpndomain.com through to the container, which
        # names it in its own server_name.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # no buffering of upload bodies to disk before forwarding
        proxy_request_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────────────────
# AR-02 — TLS, ready to enable. Staging runs over plain HTTP by decision, which means a
# password at sign-in and the bearer token that follows both cross the network in cleartext
# and can be replayed for the life of the token. That is a risk accepted for a closed staging
# network; it must not carry into production.
#
# To enable: obtain a certificate for the host, uncomment this block and the redirect below,
# uncomment the Strict-Transport-Security header above, then: nginx -t && systemctl reload nginx
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name test-it-inventory.kpndomain.com;
#
#     ssl_certificate     /etc/ssl/certs/bc-inventory.crt;
#     ssl_certificate_key /etc/ssl/private/bc-inventory.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     client_max_body_size 110m;
#     # ... copy the location blocks from the HTTP server above, headers included ...
# }
#
