# BC Inventory — nginx on the FE server (172.28.92.56).
# Mounted read-only by docker-compose, so the API address can be changed and the container
# restarted without rebuilding the image.
server {
    listen 80 default_server;

    # Staging hostname, plus the private IP so http://172.28.92.56:8088 keeps working.
    # This is the only server block in the container, so anything else still lands here.
    server_name test-it-inventory.kpndomain.com 172.28.92.56 _;

    # AR-05 — security response headers. The session token lives in sessionStorage, so a script
    # injection would read it directly; the CSP is the second line that stops one executing.
    # "always" so they are present on error responses too, not just 200s.
    add_header X-Frame-Options "DENY" always;                    # no framing, so no clickjacking
    add_header X-Content-Type-Options "nosniff" always;          # no MIME guessing
    add_header Referrer-Policy "no-referrer" always;             # report URLs never leak outward
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Everything the app loads is served from this origin; nothing is fetched cross-origin.
    # style-src allows inline because React sets element style attributes directly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Enable once TLS terminates in front of this server (AR-02):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;                                           # don't advertise the version
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Staggered above the API's 100 MB cap so an oversized file gets the API's readable
    # JSON error instead of nginx's bare 413 page. Kestrel sits higher still, at 120 MB.
    client_max_body_size 110m;

    # Uploads of a 30 MB BC40 extract can take a while to parse server-side.
    proxy_connect_timeout 15s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;

    location /api/ {
        # The API lives on the backend server; no docker DNS here, so use its address.
        proxy_pass http://172.28.92.57:8085$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # repeated because this location sets its own add_header (nginx does not merge them)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # index.html and every SPA route must never be cached, or a browser keeps loading the
    # previous bundle after a deploy. An exact-match `location = /index.html` is not enough:
    # try_files serves the fallback inside this location, so the header has to live here.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        # repeated because this location sets its own add_header (nginx does not merge them)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}

# Staging is HTTP-only by decision. Requests arrive from the host nginx on this server
# (host-nginx-vhost.conf), which owns port 80 and forwards test-it-inventory.kpndomain.com here.
# TLS is a production concern and would be terminated upstream, not in this container.
