# BC Inventory — nginx on the FE server (172.28.92.56).
# Mounted read-only by docker-compose, so the API address can be changed and the container
# restarted without rebuilding the image.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 100m;

    # Uploads of a 30 MB BC40 extract can take a while to parse server-side.
    proxy_connect_timeout 15s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;

    location /api/ {
        # The API lives on the backend server; no docker DNS here, so use its address.
        proxy_pass http://172.28.92.57:8085$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users keep running an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
