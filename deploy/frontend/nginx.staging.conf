# BC Inventory — nginx on the FE server (172.28.92.56).
# Mounted read-only by docker-compose, so the API address can be changed and the container
# restarted without rebuilding the image.
server {
    listen 80 default_server;

    # Staging hostname, plus the private IP so http://172.28.92.56:8088 keeps working.
    # This is the only server block in the container, so anything else still lands here.
    server_name test-it-inventory.kpndomain.com 172.28.92.56 _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Staggered above the API's 100 MB cap so an oversized file gets the API's readable
    # JSON error instead of nginx's bare 413 page. Kestrel sits higher still, at 120 MB.
    client_max_body_size 110m;

    # Uploads of a 30 MB BC40 extract can take a while to parse server-side.
    proxy_connect_timeout 15s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;

    location /api/ {
        # The API lives on the backend server; no docker DNS here, so use its address.
        proxy_pass http://172.28.92.57:8085$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html and every SPA route must never be cached, or a browser keeps loading the
    # previous bundle after a deploy. An exact-match `location = /index.html` is not enough:
    # try_files serves the fallback inside this location, so the header has to live here.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}

# ---------------------------------------------------------------------------
# HTTPS. The PRD requires TLS everywhere, so put a certificate in front of this
# before the hostname is given to real users.
#
# Preferred: terminate TLS on the corporate load balancer and keep forwarding
# plain HTTP to this container — nothing below is then needed.
#
# To terminate here instead, mount the certificate into the container
#   ./certs:/etc/nginx/certs:ro
# in docker-compose.yml, uncomment this block, and change the server block
# above to `listen 80;` plus a redirect:
#   if ($host = test-it-inventory.kpndomain.com) { return 301 https://$host$request_uri; }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name test-it-inventory.kpndomain.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # then repeat the root/location blocks from the server above
# }
