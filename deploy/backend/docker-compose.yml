# BC Inventory — API tier   ·   staging host 172.28.92.57
# Published on 8085: the 3000/4000/5000 ranges and 13000 are already taken on this host.
name: bc-inventory-api

services:
  api:
    build:
      context: ../../backend
    image: bc-inventory-api:staging
    container_name: bc-inventory-api
    restart: unless-stopped
    environment:
      # Database name and user are variables so the app can be pointed at an ApsaraDB RDS
      # account whose names differ from the self-managed ones.
      ConnectionStrings__Db: "Host=${DB_HOST:-172.28.92.60};Port=${DB_PORT:-5443};Database=${DB_NAME:-bcinventory};Username=${DB_USER:-bcapp};Password=${DB_PASSWORD:?set DB_PASSWORD in .env};SSL Mode=${DB_SSLMODE:-Prefer};Trust Server Certificate=true;Maximum Pool Size=25;Timeout=15;Command Timeout=60"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env — 32+ random chars}
      Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-120}
      # false when DB_USER is the least-privilege role, which may not alter the schema.
      Db__AutoMigrate: ${DB_AUTO_MIGRATE:-true}
      Cors__Origins: ${CORS_ORIGINS:-}
      # First-run only: initial passwords for the two seeded accounts.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      Seed__SitePassword: ${SEED_SITE_PASSWORD:?set SEED_SITE_PASSWORD in .env}
      # One-shot rescue for a locked-out environment; remove again after use.
      Seed__ResetAdminPassword: ${SEED_RESET_ADMIN:-false}
      # Alert e-mail. Point at the corporate relay, or leave unset to disable sending.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-25}
      Smtp__From: ${SMTP_FROM:-bc-inventory@energi-up.com}
      Smtp__UseTls: ${SMTP_USE_TLS:-true}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      # Sample auto-ingest is demo data — leave unmounted so staging starts empty.
      SampleData__Dir: ${SAMPLE_DIR:-/samples}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Staging
      TZ: Asia/Jakarta
    ports:
      # reachable from the frontend server only (see security-group rules in DEPLOYMENT.md)
      - "172.28.92.57:8085:8080"
    volumes:
      # Uncomment to seed staging with the sample extracts on first start:
      # - ../../docs:/samples:ro
      # The API runs as the unprivileged bcinv user (AR-07), so its keys live in that home.
      - bcinv_dpkeys:/home/bcinv/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  bcinv_dpkeys:
