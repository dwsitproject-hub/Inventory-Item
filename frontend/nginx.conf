server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Staggered above the API's 100 MB cap so an oversized file gets the API's readable
    # JSON error instead of nginx's bare 413 page. Kestrel sits higher still, at 120 MB.
    client_max_body_size 110m;

    # Docker's embedded DNS. Resolving through a variable forces nginx to re-resolve at
    # request time — without this it caches the API container's IP at startup and returns
    # 502 forever once that container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
